name: Build ApneScan EXE (Windows)

# Manually runnable from the Actions tab, and also runs automatically
# whenever this branch is pushed. Produces a SINGLE self-contained
# ApneScan.exe (no separate .NET install needed to run it) and publishes
# it to a GitHub Release for a direct one-click .exe download.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/share-41mb-file-j8ol4i

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish ApneScan as a single self-contained .exe
        run: >
          dotnet publish NAPS2.App.WinForms/NAPS2.App.WinForms.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/ApneScan
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Rename output to ApneScan.exe and show result
        shell: bash
        run: |
          # The project's AssemblyName is still "NAPS2", so the published
          # single-file exe is NAPS2.exe. Ship it under the ApneScan name.
          cp publish/ApneScan/NAPS2.exe ApneScan.exe
          echo "Single-file exe:"
          ls -lh ApneScan.exe

      - name: Upload build artifact (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: ApneScan-Windows-x64
          path: ApneScan.exe
          if-no-files-found: error

      - name: Publish to a GitHub Release (direct .exe download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apnescan-latest
          name: ApneScan (latest Windows build)
          body: |
            Single-file, self-contained Windows build of ApneScan.
            Just download **ApneScan.exe** below and run it — no .NET install needed.
          files: ApneScan.exe
          make_latest: true
