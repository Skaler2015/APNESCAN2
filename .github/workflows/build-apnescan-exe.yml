name: Build ApneScan EXE (Windows)

# Runs on every push to this branch and can be triggered manually.
# Produces:
#   - ApneScan-Setup.exe : a Windows installer (double-click to install)
#   - update.json        : the manifest the in-app one-click updater reads
# Both are published to the "apnescan-latest" GitHub Release so that
# installed copies can update themselves in one click.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/share-41mb-file-j8ol4i
    paths-ignore:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: write
  actions: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read app version
        id: version
        shell: bash
        run: |
          VER=$(grep -oE '<Version>[^<]+' ApneScan.Studio/ApneScan.Studio.csproj | head -1 | sed 's/<Version>//')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "ApneScan version: $VER"

      - name: Publish ApneScan Studio (new UI + real scan/print engine)
        run: >
          dotnet publish ApneScan.Studio/ApneScan.Studio.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/ApneScan
          /p:DebugType=None
          /p:DebugSymbols=false

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build ApneScan-Setup.exe
        env:
          APNESCAN_VERSION: ${{ steps.version.outputs.version }}
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.version }}
          installer\apnescan.iss

      - name: Generate update.json manifest
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "installer-out/ApneScan-Setup.exe"
          $bytes = [System.IO.File]::ReadAllBytes($setup)
          $sha = [System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
          $b64 = [Convert]::ToBase64String($sha)
          $url = "https://github.com/Skaler2015/APNESCAN2/releases/latest/download/ApneScan-Setup.exe"
          $manifest = [ordered]@{
            versions = @(
              [ordered]@{
                name     = $env:APP_VERSION
                requires = @{}
                files    = @{ exe = [ordered]@{ url = $url; sha256 = $b64 } }
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "installer-out/update.json" -Encoding utf8
          Write-Host "update.json:"
          Get-Content "installer-out/update.json"

      - name: Show output
        shell: bash
        run: ls -lh installer-out/

      - name: Upload build artifacts (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: ApneScan-Windows-Setup
          path: |
            installer-out/ApneScan-Setup.exe
            installer-out/update.json
          if-no-files-found: error

      - name: Publish to GitHub Release (installer + update manifest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apnescan-latest
          name: ApneScan (latest Windows build)
          body: |
            Windows installer for ApneScan.

            **Download `ApneScan-Setup.exe` below and run it to install.**
            Once installed, ApneScan can update itself in one click
            (Help/About → check for updates) whenever a newer version is released.
          files: |
            installer-out/ApneScan-Setup.exe
            installer-out/update.json
          make_latest: true

      - name: Update the website (redeploy with the new version)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-website.yml --ref "${{ github.ref_name }}"
